<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="igGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD600" />
      <stop offset="25%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#FF0069" />
      <stop offset="75%" stop-color="#D300C5" />
      <stop offset="100%" stop-color="#7638FA" />
    </linearGradient>
    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#igGradient)" />
  <rect x="8" y="8" width="84" height="84" rx="24" fill="#0B0F17" fill-opacity="0.75" />

  <!-- Instagram Camera Aperture Circle -->
  <circle cx="50" cy="50" r="30" stroke="url(#igGradient)" stroke-width="4.5" />
  
  <!-- Audio Waveform Bars (Glowing AI Speech) -->
  <g filter="url(#glow)">
    <line x1="32" y1="50" x2="32" y2="50" stroke="url(#waveGlow)" stroke-width="4" stroke-linecap="round" />
    <line x1="38" y1="42" x2="38" y2="58" stroke="url(#waveGlow)" stroke-width="4" stroke-linecap="round" />
    <line x1="44" y1="34" x2="44" y2="66" stroke="url(#waveGlow)" stroke-width="4" stroke-linecap="round" />
    <line x1="50" y1="28" x2="50" y2="72" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <line x1="56" y1="34" x2="56" y2="66" stroke="url(#waveGlow)" stroke-width="4" stroke-linecap="round" />
    <line x1="62" y1="42" x2="62" y2="58" stroke="url(#waveGlow)" stroke-width="4" stroke-linecap="round" />
    <line x1="68" y1="50" x2="68" y2="50" stroke="url(#waveGlow)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Top Right Camera Flash / AI Sparkle -->
  <circle cx="70" cy="30" r="4.5" fill="#00F2FE" filter="url(#glow)" />
</svg>
